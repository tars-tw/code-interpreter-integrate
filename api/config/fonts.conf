<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Sandbox-wide fontconfig file, loaded through FONTCONFIG_FILE because the
  jail mounts only /usr and so never sees /etc/fonts.

  cairo's toy font API (used by cairosvg) takes the single best match without
  per-glyph fallback, so each generic family leads with a CJK face that also
  covers Latin, matching api/config/matplotlibrc.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/.fontconfig-cache</cachedir>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK TC</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK TC</family>
      <family>AR PL UMing TW</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK TC</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Unknown or Windows-only family names fall back to sans-serif. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
</fontconfig>
